<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GM 전신 + 립싱크 테스트</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#111; color:#f7efe4; font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #viewer { width:100vw; height:100vh; }
    #panel { position:fixed; top:14px; left:14px; width:min(460px, calc(100vw - 28px)); max-height:calc(100vh - 28px); overflow:auto; padding:14px; border:1px solid rgba(255,255,255,.16); border-radius:12px; background:rgba(20,16,12,.9); box-shadow:0 16px 50px rgba(0,0,0,.45); backdrop-filter:blur(8px); }
    h1 { margin:0 0 8px; font-size:18px; }
    h2 { margin:14px 0 8px; font-size:14px; color:#ffd68a; }
    p { margin:6px 0; color:#d8cbbb; font-size:13px; line-height:1.45; }
    .row { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
    button { border:1px solid rgba(255,216,150,.35); border-radius:8px; background:#b87935; color:#fff7ed; padding:8px 10px; font-weight:700; cursor:pointer; }
    button.secondary { background:#30241a; }
    button.danger { background:#663027; }
    button:disabled { opacity:.5; cursor:wait; }
    input, textarea, select { width:100%; border:1px solid rgba(255,216,150,.28); border-radius:8px; background:#1f1812; color:#fff; padding:9px; }
    textarea { min-height:70px; resize:vertical; }
    #status { white-space:pre-line; padding:8px; border-radius:8px; background:rgba(255,255,255,.06); }
    #morphButtons button { min-width:88px; }
    #animButtons button { min-width:120px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="viewer"></div>
  <section id="panel">
    <h1>GM 전신 + 립싱크 테스트</h1>
    <p id="status">로딩 준비 중...</p>

    <h2>1. Shape Key 직접 테스트</h2>
    <div id="morphButtons" class="row"></div>
    <div class="row">
      <button class="secondary" id="debugMorphBtn">Morph Debug</button>
      <button class="danger" id="resetMorphBtn">입모양 초기화</button>
    </div>

    <h2>2. 립싱크 랜덤 테스트</h2>
    <div class="row">
      <button id="startLipBtn">랜덤 립싱크 시작</button>
      <button class="danger" id="stopLipBtn">정지</button>
    </div>

    <h2>3. 전신 애니메이션 테스트</h2>
    <div id="animButtons" class="row"></div>

    <h2>4. TTS + 립싱크 테스트</h2>
    <textarea id="ttsText">깨어났군요. 증기와 비늘의 세계에 온 것을 환영합니다.</textarea>
    <div class="row">
      <button id="ttsBtn">/api/tts로 음성 재생</button>
      <button class="secondary" id="fakeSpeechBtn">TTS 없이 말하는 척</button>
    </div>
    <p>기존 프로젝트의 <code>/api/tts</code>가 있으면 실제 음성과 함께 립싱크가 동작합니다. 없으면 “TTS 없이 말하는 척”으로 입 움직임만 확인하세요.</p>
  </section>
  <script type="module" src="/static/src/gm-lipsync-motion-test.js"></script>
</body>
</html>
